name: test
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install ESLint
        run: npm ci --ignore-scripts
      - name: Lint
        run: ./node_modules/.bin/eslint "ai-status-monitor@rloutrel.github.com/" --ext .js
      - name: Syntax check
        run: |
          find "ai-status-monitor@rloutrel.github.com" -name "*.js" -print0 | xargs -0 -n1 node --check
          find "test" \( -name "*.js" -o -name "*.mjs" \) -print0 | xargs -0 -n1 node --check
      - name: Validate metadata
        run: node "test/validateMetadata.js"
      - name: Unit tests
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include="ai-status-monitor@rloutrel.github.com/**/*.js" \
            --test-coverage-exclude="**/test/**" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=lcov.info \
            "test/"*.test.js
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
